[package]
name = "cash"
version = "0.1.0"
edition = "2024"
default-run = "cash"
description = "CASH: Cross-Agent Session History for coding agents"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
getrandom = "0.2"
uuid = { version = "1", features = ["v4", "v7"] }
toml = "0.8"
